<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURVIVOR ROYALE 🏝️ - 8-Player Battlegrounds</title>

  <!-- PeerJS P2P Networking & Confetti Juara -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f59e0b;
      --accent: #ef4444;
      --safe: #10b981;
      --panel: #0f172a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #022c22;
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #15803d;
    }

    /* HUD In-Game */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 800;
      backdrop-filter: blur(6px);
    }

    .bar-container {
      width: 160px;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill { height: 100%; transition: width 0.15s ease; }

    #killfeed {
      position: absolute;
      top: 65px;
      right: 16px;
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
    }
    .kill-item {
      background: rgba(0, 0, 0, 0.7);
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      animation: fadeOut 4s forwards;
    }

    /* Virtual Mobile Controls */
    #touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
    }
    .joy-stick {
      position: absolute;
      bottom: 30px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.25);
      pointer-events: auto;
    }
    #move-joy { left: 25px; }
    #aim-joy { right: 25px; }
    .nub {
      position: absolute;
      top: 50%; left: 50%;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--primary);
      transform: translate(-50%, -50%);
    }

    /* Screen Modals */
    .screen {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .hidden { display: none !important; }

    .card {
      background: var(--panel);
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 2.2rem;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--primary);
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 1.5px;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #020617;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-gold { background: var(--primary); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-dark { background: #1e293b; color: #fff; border: 1px solid #475569; }

    @keyframes fadeOut {
      0% { opacity: 1; transform: translateX(20px); }
      15% { opacity: 1; transform: translateX(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- HUD In-Game -->
  <div id="hud" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div class="hud-box">
        <div style="font-size:0.75rem; color:#94a3b8;">DARAH (HP)</div>
        <div class="bar-container"><div class="bar-fill" id="hp-bar" style="background:#22c55e; width:100%;"></div></div>
        <div style="font-size:0.75rem; color:#94a3b8; margin-top:6px;">ARMOR (VEST)</div>
        <div class="bar-container"><div class="bar-fill" id="armor-bar" style="background:#0284c7; width:0%;"></div></div>
      </div>
      <div class="hud-box" style="text-align:right;">
        <div style="font-size:1.1rem; color:var(--primary);" id="alive-txt">ALIVE: 8</div>
        <div style="font-size:0.85rem; color:#94a3b8;" id="kill-txt">KILLS: 0</div>
      </div>
    </div>

    <div id="killfeed"></div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="hud-box" id="weapon-badge">SENJATA: 👊 TINJU</div>
      <div class="hud-box" style="color:var(--accent);" id="zone-badge">ZONA AMAN: 100%</div>
    </div>
  </div>

  <!-- Virtual Mobile Joysticks -->
  <div id="touch-controls" class="hidden">
    <div class="joy-stick" id="move-joy"><div class="nub" id="move-nub"></div></div>
    <div class="joy-stick" id="aim-joy"><div class="nub" id="aim-nub" style="background:var(--accent);"></div></div>
  </div>

  <!-- Menu Utama -->
  <div id="menu-screen" class="screen">
    <div class="card">
      <h1>SURVIVOR ROYALE</h1>
      <p class="tagline">8-PLAYER SURVIVAL BATTLEGROUND</p>

      <input type="text" id="nickname" placeholder="NAMA SURVIVOR..." maxlength="10">

      <button class="btn btn-accent" id="btn-solo">⚡ MAIN SOLO LANGSUNG (VS 7 BOTS)</button>
      <div style="margin: 12px 0; color:#64748b; font-weight:800;">— ATAU MULTIPLAYER —</div>
      <button class="btn btn-gold" id="btn-host">BUAT ROOM (HOST)</button>
      <input type="text" id="room-input" placeholder="KODE ROOM..." style="text-transform:uppercase; margin-top:10px;">
      <button class="btn btn-dark" id="btn-join">GABUNG ROOM</button>
    </div>
  </div>

  <!-- Lobby Tunggu -->
  <div id="lobby-screen" class="screen hidden">
    <div class="card">
      <h2>LOBBY TEMPUR</h2>
      <p style="color:#94a3b8; font-size:0.85rem; margin-top:4px;">KODE ROOM UNTUK TEMAN:</p>
      <div id="room-id-txt" style="font-size:2.2rem; font-weight:900; color:var(--primary); letter-spacing:4px; margin: 10px 0;">----</div>

      <div id="roster-box" style="text-align:left; background:#020617; padding:10px; border-radius:10px; margin-bottom:15px; max-height:140px; overflow-y:auto;"></div>

      <button class="btn btn-gold hidden" id="btn-start">TERJUN KE PULAU! 🪂</button>
      <p id="wait-msg" style="color:#94a3b8; font-size:0.85rem;">Menunggu Host memulai...</p>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="winner-screen" class="screen hidden">
    <div class="card">
      <h1 id="win-title" style="color:var(--primary);">WINNER WINNER!</h1>
      <p id="win-sub" style="margin:10px 0 20px; color:#94a3b8;">CHICKEN DINNER 🍗</p>
      <button class="btn btn-gold" onclick="location.reload()">MAIN LAGI</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. SYNTHESIS AUDIO (Web Audio API Mandiri)
       ========================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
    }

    function playSound(type) {
      if (!actx) return;
      const osc = actx.createOscillator();
      const gain = actx.createGain();

      if (type === 'punch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, actx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, actx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.4, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.1);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.1);
      } else if (type === 'shotgun') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, actx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.7, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.25);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.25);
      } else if (type === 'rifle') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, actx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.12);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.12);
      } else if (type === 'loot') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, actx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.1);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.1);
      }
    }

    /* ==========================================================
       2. DUNIA GAME & ITEM DROPS
       ========================================================== */
    const MAP_SIZE = 2400;
    const WEAPONS = {
      FIST: { name: '👊 TINJU', dmg: 20, rate: 400, count: 1, spd: 0, spread: 0 },
      SHOTGUN: { name: '💥 SHOTGUN', dmg: 22, rate: 700, count: 5, spd: 14, spread: 0.35 },
      RIFLE: { name: '🔫 AK-47', dmg: 28, rate: 160, count: 1, spd: 18, spread: 0.08 },
      SNIPER: { name: '🎯 SNIPER AWM', dmg: 85, rate: 1100, count: 1, spd: 26, spread: 0 }
    };

    // Lingkaran Zona Gas (Storm)
    const storm = {
      x: MAP_SIZE / 2,
      y: MAP_SIZE / 2,
      radius: MAP_SIZE * 0.7,
      targetRadius: 100,
      shrinkSpeed: 0.35
    };

    class Crate {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.hp = 50;
        this.dead = false;
      }
    }

    class GroundItem {
      constructor(x, y, type) {
        this.x = x; this.y = y;
        this.type = type; // 'SHOTGUN', 'RIFLE', 'SNIPER', 'MEDKIT', 'ARMOR'
      }
    }

    class Bush {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.radius = 48;
      }
    }

    // Inisialisasi Map
    const crates = [];
    const items = [];
    const bushes = [];

    for (let i = 0; i < 45; i++) crates.push(new Crate(Math.random() * (MAP_SIZE - 400) + 200, Math.random() * (MAP_SIZE - 400) + 200));
    for (let i = 0; i < 35; i++) bushes.push(new Bush(Math.random() * (MAP_SIZE - 300) + 150, Math.random() * (MAP_SIZE - 300) + 150));

    /* ==========================================================
       3. SURVIVOR ENTITY (PLAYER & AI BOTS)
       ========================================================== */
    class Survivor {
      constructor(id, name, isBot = false) {
        this.id = id;
        this.name = name;
        this.isBot = isBot;
        this.x = Math.random() * (MAP_SIZE - 600) + 300;
        this.y = Math.random() * (MAP_SIZE - 600) + 300;
        this.angle = 0;
        this.hp = 100;
        this.armor = 0;
        this.kills = 0;
        this.weapon = 'FIST';
        this.dead = false;
        this.inBush = false;
        this.lastShot = 0;
        this.punchPunch = 0; // Animasi ayunan tinju
        this.input = { x: 0, y: 0, fire: false };
      }

      update() {
        if (this.dead) return;

        // Kontrol Bot AI
        if (this.isBot) this.updateBotAI();

        // Gerak Fisika
        const len = Math.hypot(this.input.x, this.input.y);
        if (len > 0.1) {
          const spd = 4.2;
          this.x += (this.input.x / len) * spd;
          this.y += (this.input.y / len) * spd;
        }

        // Batas Peta
        this.x = Math.max(30, Math.min(MAP_SIZE - 30, this.x));
        this.y = Math.max(30, Math.min(MAP_SIZE - 30, this.y));

        // Cek Zona Badai Gas
        const distToCenter = Math.hypot(this.x - storm.x, this.y - storm.y);
        if (distToCenter > storm.radius) {
          this.takeDamage(0.2, 'STORM');
        }

        // Cek Sembunyi di Semak
        this.inBush = bushes.some(b => Math.hypot(b.x - this.x, b.y - this.y) < b.radius);

        // Ambil Item di Lantai
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          if (Math.hypot(it.x - this.x, it.y - this.y) < 32) {
            playSound('loot');
            if (it.type === 'MEDKIT') this.hp = Math.min(100, this.hp + 50);
            else if (it.type === 'ARMOR') this.armor = 100;
            else this.weapon = it.type;
            items.splice(i, 1);
          }
        }

        // Tembak / Pukul
        const wp = WEAPONS[this.weapon];
        if (this.input.fire && Date.now() - this.lastShot > wp.rate) {
          this.attack();
          this.lastShot = Date.now();
        }
      }

      attack() {
        const wp = WEAPONS[this.weapon];
        if (this.weapon === 'FIST') {
          playSound('punch');
          this.punchPunch = 1;
          // Cek hantam peti atau musuh dekat
          crates.forEach(c => {
            if (!c.dead && Math.hypot(c.x - (this.x + Math.cos(this.angle) * 30), c.y - (this.y + Math.sin(this.angle) * 30)) < 35) {
              c.hp -= wp.dmg;
              if (c.hp <= 0) breakCrate(c);
            }
          });
          Object.values(players).forEach(p => {
            if (p.id !== this.id && !p.dead && Math.hypot(p.x - this.x, p.y - this.y) < 50) {
              p.takeDamage(wp.dmg, this.name);
            }
          });
        } else {
          playSound(this.weapon === 'SHOTGUN' ? 'shotgun' : 'rifle');
          for (let i = 0; i < wp.count; i++) {
            const spread = (Math.random() - 0.5) * wp.spread;
            bullets.push(new Bullet(this.id, this.x, this.y, this.angle + spread, wp.spd, wp.dmg));
          }
        }
      }

      takeDamage(amount, attackerName) {
        if (this.dead) return;

        if (this.armor > 0 && attackerName !== 'STORM') {
          const absorb = Math.min(this.armor, amount * 0.6);
          this.armor -= absorb;
          amount -= absorb;
        }

        this.hp -= amount;

        if (this.hp <= 0) {
          this.dead = true;
          aliveCount--;
          addKillfeed(attackerName, this.name);

          // Drop senjata saat mati
          if (this.weapon !== 'FIST') items.push(new GroundItem(this.x, this.y, this.weapon));
          items.push(new GroundItem(this.x + 15, this.y, 'MEDKIT'));

          checkVictory();
        }
      }

      updateBotAI() {
        // AI lari ke zona aman jika berada di luar
        const distToCenter = Math.hypot(this.x - storm.x, this.y - storm.y);
        if (distToCenter > storm.radius * 0.8) {
          const ang = Math.atan2(storm.y - this.y, storm.x - this.x);
          this.input.x = Math.cos(ang);
          this.input.y = Math.sin(ang);
          this.angle = ang;
          return;
        }

        // Cari musuh terdekat
        const targets = Object.values(players).filter(p => p.id !== this.id && !p.dead && !p.inBush);
        if (targets.length > 0) {
          let nearest = targets[0];
          let minDist = 9999;
          targets.forEach(t => {
            const d = Math.hypot(t.x - this.x, t.y - this.y);
            if (d < minDist) { minDist = d; nearest = t; }
          });

          const ang = Math.atan2(nearest.y - this.y, nearest.x - this.x);
          this.angle = ang;

          if (minDist < 300) {
            this.input.x = this.weapon === 'FIST' ? Math.cos(ang) : -Math.cos(ang) * 0.4;
            this.input.y = this.weapon === 'FIST' ? Math.sin(ang) : -Math.sin(ang) * 0.4;
            this.input.fire = Math.random() < 0.08;
          } else {
            this.input.x = Math.cos(ang);
            this.input.y = Math.sin(ang);
            this.input.fire = false;
          }
        }
      }
    }

    class Bullet {
      constructor(ownerId, x, y, angle, speed, dmg) {
        this.ownerId = ownerId;
        this.x = x + Math.cos(angle) * 25;
        this.y = y + Math.sin(angle) * 25;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.dmg = dmg;
        this.dead = false;
        this.life = 45;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (--this.life <= 0) this.dead = true;

        // Cek Kena Peti
        crates.forEach(c => {
          if (!c.dead && Math.hypot(c.x - this.x, c.y - this.y) < 25) {
            c.hp -= this.dmg;
            this.dead = true;
            if (c.hp <= 0) breakCrate(c);
          }
        });

        // Cek Kena Pemain
        Object.values(players).forEach(p => {
          if (p.id !== this.ownerId && !p.dead && Math.hypot(p.x - this.x, p.y - this.y) < 22) {
            const killer = players[this.ownerId] ? players[this.ownerId].name : 'Peluru';
            p.takeDamage(this.dmg, killer);
            if (p.dead && players[this.ownerId]) players[this.ownerId].kills++;
            this.dead = true;
          }
        });
      }
    }

    function breakCrate(c) {
      c.dead = true;
      const lootTypes = ['SHOTGUN', 'RIFLE', 'SNIPER', 'MEDKIT', 'ARMOR'];
      const pick = lootTypes[Math.floor(Math.random() * lootTypes.length)];
      items.push(new GroundItem(c.x, c.y, pick));
    }

    let players = {};
    let bullets = [];
    let aliveCount = 8;
    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 6);
    let myName = 'Survivor';
    let gameState = 'MENU';

    function addKillfeed(k, v) {
      const kf = document.getElementById('killfeed');
      const d = document.createElement('div');
      d.className = 'kill-item';
      d.innerHTML = `<strong>${k}</strong> 💥 <em>${v}</em>`;
      kf.prepend(d);
      setTimeout(() => d.remove(), 4000);
    }

    function checkVictory() {
      const alivePlayers = Object.values(players).filter(p => !p.dead);
      if (alivePlayers.length === 1 && gameState === 'INGAME') {
        gameState = 'OVER';
        confetti({ particleCount: 150, spread: 80 });
        const winner = alivePlayers[0];
        document.getElementById('win-title').innerText = winner.id === myPlayerId ? 'WINNER WINNER!' : 'MATCH SELESAI!';
        document.getElementById('win-sub').innerText = `JUARA 1: ${winner.name} 👑`;
        document.getElementById('winner-screen').classList.remove('hidden');
      }
    }

    /* ==========================================================
       4. INPUT KEYBOARD, MOUSE & TOUCH
       ========================================================== */
    const keys = {};
    let mouse = { x: 0, y: 0 };

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', () => { if (players[myPlayerId]) players[myPlayerId].input.fire = true; });
    window.addEventListener('mouseup', () => { if (players[myPlayerId]) players[myPlayerId].input.fire = false; });

    // Mobile Virtual Joysticks
    function setupJoystick(joyId, nubId, cb) {
      const joy = document.getElementById(joyId);
      const nub = document.getElementById(nubId);
      let tId = null, center = { x: 0, y: 0 };

      joy.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        tId = t.identifier;
        const rect = joy.getBoundingClientRect();
        center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      });

      joy.addEventListener('touchmove', e => {
        for (let t of e.changedTouches) {
          if (t.identifier === tId) {
            let dx = t.clientX - center.x;
            let dy = t.clientY - center.y;
            const dist = Math.hypot(dx, dy);
            const max = 40;
            if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
            nub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            cb(dx / max, dy / max);
          }
        }
      });

      const end = () => {
        tId = null;
        nub.style.transform = `translate(-50%, -50%)`;
        cb(0, 0);
      };
      joy.addEventListener('touchend', end);
      joy.addEventListener('touchcancel', end);
    }

    setupJoystick('move-joy', 'move-nub', (x, y) => {
      if (players[myPlayerId]) { players[myPlayerId].input.x = x; players[myPlayerId].input.y = y; }
    });

    setupJoystick('aim-joy', 'aim-nub', (x, y) => {
      if (players[myPlayerId]) {
        if (Math.hypot(x, y) > 0.3) {
          players[myPlayerId].angle = Math.atan2(y, x);
          players[myPlayerId].input.fire = true;
        } else {
          players[myPlayerId].input.fire = false;
        }
      }
    });

    /* ==========================================================
       5. MENU, LOBBY & PERJALANAN GAME
       ========================================================== */
    function enterBattle() {
      gameState = 'INGAME';
      aliveCount = Object.keys(players).length;
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      if ('ontouchstart' in window) document.getElementById('touch-controls').classList.remove('hidden');
    }

    document.getElementById('btn-solo').onclick = () => {
      initAudio();
      myName = document.getElementById('nickname').value.trim() || 'Survivor';
      players[myPlayerId] = new Survivor(myPlayerId, myName);

      for (let i = 1; i <= 7; i++) {
        const bId = 'bot_' + i;
        players[bId] = new Survivor(bId, `Bot #${i}`, true);
      }
      enterBattle();
    };

    document.getElementById('btn-host').onclick = () => {
      initAudio();
      myName = document.getElementById('nickname').value.trim() || 'Survivor';
      const code = 'PUBG' + Math.floor(1000 + Math.random() * 9000);
      players[myPlayerId] = new Survivor(myPlayerId, myName);

      document.getElementById('room-id-txt').innerText = code;
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.remove('hidden');
      document.getElementById('btn-start').classList.remove('hidden');
      document.getElementById('wait-msg').classList.add('hidden');
      document.getElementById('roster-box').innerHTML = `<div>⚡ <strong>${myName} (Host)</strong></div>`;
    };

    document.getElementById('btn-join').onclick = () => {
      initAudio();
      const code = document.getElementById('room-input').value.trim();
      if (!code) return alert("Masukkan Kode Room!");
      myName = document.getElementById('nickname').value.trim() || 'Survivor';

      document.getElementById('room-id-txt').innerText = code.toUpperCase();
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.remove('hidden');
      document.getElementById('roster-box').innerHTML = `<div>⚡ <strong>${myName}</strong></div>`;
    };

    document.getElementById('btn-start').onclick = () => {
      // Isi slot kosong dengan Bot agar total 8 pemain
      for (let i = Object.keys(players).length + 1; i <= 8; i++) {
        const bId = 'bot_' + i;
        players[bId] = new Survivor(bId, `Target #${i}`, true);
      }
      enterBattle();
    };

    /* ==========================================================
       6. RENDERING 2D CANVAS (PULAU, TANK, ITEM, & DARAH)
       ========================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const me = players[myPlayerId] || { x: MAP_SIZE / 2, y: MAP_SIZE / 2, hp: 100, armor: 0, kills: 0 };

      // Kontrol Desktop (WASD & Mouse)
      if (gameState === 'INGAME' && !('ontouchstart' in window) && players[myPlayerId]) {
        players[myPlayerId].input.x = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
        players[myPlayerId].input.y = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
        players[myPlayerId].angle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
      }

      // Update Logika Game
      if (gameState === 'INGAME') {
        Object.values(players).forEach(p => p.update());

        // Update Peluru
        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].update();
          if (bullets[i].dead) bullets.splice(i, 1);
        }

        // Zona Gas Mengecil
        if (storm.radius > storm.targetRadius) storm.radius -= storm.shrinkSpeed;

        // Update HUD
        document.getElementById('hp-bar').style.width = `${Math.max(0, me.hp)}%`;
        document.getElementById('armor-bar').style.width = `${Math.max(0, me.armor)}%`;
        document.getElementById('alive-txt').innerText = `ALIVE: ${aliveCount}`;
        document.getElementById('kill-txt').innerText = `KILLS: ${me.kills}`;
        document.getElementById('weapon-badge').innerText = `SENJATA: ${WEAPONS[me.weapon]?.name || 'TINJU'}`;
        document.getElementById('zone-badge').innerText = `ZONA: ${Math.round((storm.radius / (MAP_SIZE * 0.7)) * 100)}%`;
      }

      ctx.save();
      // Kamera Mengikuti Pemain
      ctx.translate(-me.x + canvas.width / 2, -me.y + canvas.height / 2);

      // 1. Gambar Daratan Pulau
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      // Grid Tanah
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 2;
      for (let x = 0; x < MAP_SIZE; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke(); }
      for (let y = 0; y < MAP_SIZE; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke(); }

      // 2. Gambar Peti Kayu (Loot Crates)
      crates.forEach(c => {
        if (c.dead) return;
        ctx.fillStyle = '#854d0e';
        ctx.fillRect(c.x - 18, c.y - 18, 36, 36);
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 3;
        ctx.strokeRect(c.x - 18, c.y - 18, 36, 36);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('CRATE', c.x - 16, c.y + 4);
      });

      // 3. Gambar Item di Lantai
      items.forEach(it => {
        ctx.beginPath();
        ctx.arc(it.x, it.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = it.type === 'MEDKIT' ? '#22c55e' : (it.type === 'ARMOR' ? '#0284c7' : '#f59e0b');
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(it.type.substring(0, 4), it.x, it.y + 3);
      });

      // 4. Gambar Peluru
      ctx.fillStyle = '#fef08a';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. Gambar Karakter Pemain & Bot
      Object.values(players).forEach(p => {
        if (p.dead) return;
        if (p.inBush && p.id !== myPlayerId) return; // Tidak terlihat jika di semak!

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // Tangan / Senjata
        ctx.fillStyle = '#fca5a5';
        if (p.weapon === 'FIST') {
          const punchOff = p.punchPunch ? 8 : 0;
          ctx.beginPath(); ctx.arc(14 + punchOff, -12, 6, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(14, 12, 6, 0, Math.PI * 2); ctx.fill();
          if (p.punchPunch) p.punchPunch = 0;
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(10, -3, 20, 6); // Laras Senjata
        }

        // Badan Bulat
        ctx.fillStyle = p.armor > 0 ? '#0284c7' : '#eab308';
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();

        // Nama & HP Bar
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 26);
      });

      // 6. Gambar Semak-Semak (Bisa untuk Sembunyi)
      bushes.forEach(b => {
        ctx.fillStyle = 'rgba(21, 128, 61, 0.85)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 7. Gambar Zona Gas (Storm)
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(storm.x, storm.y, storm.radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
